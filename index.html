<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tag HTML</title>
</head>
<body>
    <table border="1" height="400px" width="400px">
        <tbody align="center">
            <tr>
                <td rowspan="2" colspan="5">&lt;header&gt;</td>
            </tr>
            <tr></tr>
            <tr>
                <td rowspan="2" colspan="5">&lt;nav&gt;</td>
            </tr>
            <tr></tr>
            <tr>
                <td rowspan="3" colspan="3">&lt;section&gt;</td>
                <td rowspan="6" colspan="2">&lt;aside&gt;</td>
            </tr>
            <tr></tr>
            <tr></tr>
            <tr>
                <td rowspan="3" colspan="3">&lt;section&gt;</td>
            </tr>
            <tr></tr>
            <tr></tr>
            <tr>
                <td rowspan="1" colspan="5">&lt;footer&gt;</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
