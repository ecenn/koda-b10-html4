<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Grid</title>
    <style>
        .container {
            display: grid;
            justify-content: center;
        }
        .container > div {
            width: 600px;
            height: 150px;
            display: grid;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
        }
        .container > .midsect {
            width: 600px;
            height: 300px;
            display: grid;
            grid-template-columns: 70% 30%;
        }
        .vert {
            display: grid;
            grid-template-rows: 1fr 1fr;
            justify-content: center;
            transform: translateY(-3px);
        }
        .vert > div {
            width: 420px;
            height: 150px;
            border: 1px solid black;
            display: grid;
            place-items: center;
        }
        .midsect > div:last-child {
            display: grid;
            place-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>&lt;header&gt;</div>
        <div>&lt;nav&gt;</div>
        <div class="midsect">
            <div class="vert">
                <div>&lt;section&gt;</div>
                <div>&lt;section&gt;</div>
            </div>
            <div>&lt;aside&gt;</div>
        </div>
        <div>&lt;footer&gt;</div>

    </div>    
</body>
</html>
